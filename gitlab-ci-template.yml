---
# GitLab CI/CD Template for Terraform ECS Infrastructure
# This template can be used as a base for your GitLab CI/CD pipeline

# Define the stages of the pipeline
stages:
  - setup
  - validate
  - quality
  - security
  - plan
  - approve
  - apply
  - cleanup

# Default variables that can be overridden
variables:
  TF_VERSION: "1.0.0"
  AWS_REGION: "us-east-1"
  TF_STATE_KEY: "ecs-infrastructure/terraform.tfstate"
  TF_LOCK_TABLE: "terraform-state-lock"
  CONTAINER_IMAGE: "nginx:latest"
  ENVIRONMENT: "dev"

# Reusable templates
.terraform_docker:
  image: hashicorp/terraform:${TF_VERSION}
  before_script:
    - terraform --version
    - aws --version

.aws_auth:
  before_script:
    - aws configure set aws_access_key_id ${AWS_ACCESS_KEY_ID}
    - aws configure set aws_secret_access_key ${AWS_SECRET_ACCESS_KEY}
    - aws configure set region ${AWS_REGION}

# Setup stage
setup:
  stage: setup
  image: alpine:latest
  script:
    - apk add --no-cache curl jq python3 py3-pip
    - pip install awscli
    - aws --version
    - echo "Setting up CloudWatch logging..."
    - aws logs create-log-group --log-group-name "/gitlab/pipeline" --region ${AWS_REGION} || true
    - aws logs create-log-stream --log-group-name "/gitlab/pipeline" --log-stream-name "${CI_PIPELINE_ID}" --region ${AWS_REGION} || true
  tags:
    - docker

# Fetch secrets from AWS Secrets Manager
fetch_secrets:
  stage: setup
  image: alpine:latest
  extends: .aws_auth
  script:
    - apk add --no-cache curl jq python3 py3-pip
    - pip install awscli
    - echo "Fetching secrets from AWS Secrets Manager..."
    - aws secretsmanager get-secret-value --secret-id "terraform/ecs-infrastructure/${ENVIRONMENT}" --region ${AWS_REGION} --query SecretString --output text > secrets.json
    - cat secrets.json | jq -r 'to_entries[] | "\(.key)=\(.value)"' > secrets.env
  artifacts:
    paths:
      - secrets.env
    expire_in: 1 hour
  tags:
    - docker

# Validate Terraform code
terraform_validate:
  stage: validate
  extends: .terraform_docker
  script:
    - terraform init -backend=false
    - terraform validate
  tags:
    - docker

# Check Terraform formatting
terraform_fmt:
  stage: validate
  extends: .terraform_docker
  script:
    - terraform fmt -check -recursive
  tags:
    - docker

# SonarQube analysis
sonarqube_analysis:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=${CI_PROJECT_NAME} -Dsonar.sources=. -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN}
  only:
    - merge_requests
    - main
  tags:
    - docker

# Snyk security scan
snyk_scan:
  stage: security
  image: snyk/snyk:latest
  script:
    - snyk auth ${SNYK_TOKEN}
    - snyk test --all-projects
  only:
    - merge_requests
    - main
  allow_failure: true
  tags:
    - docker

# Terraform plan
terraform_plan:
  extends: .terraform_docker
  stage: plan
  script:
    - export $(cat secrets.env | xargs)
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
    - terraform plan -var="environment=${ENVIRONMENT}" -var="region=${AWS_REGION}" -var="container_image=${CONTAINER_IMAGE}" -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 day
  dependencies:
    - fetch_secrets
  tags:
    - docker

# Manual approval for staging and prod environments
approval:
  stage: approve
  script:
    - echo "Deployment to ${ENVIRONMENT} environment has been approved"
  when: manual
  only:
    - main
  rules:
    - if: '$ENVIRONMENT == "staging" || $ENVIRONMENT == "prod"'
  environment:
    name: ${ENVIRONMENT}
  needs:
    - terraform_plan

# Terraform apply
terraform_apply:
  extends: .terraform_docker
  stage: apply
  script:
    - export $(cat secrets.env | xargs)
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
    - terraform apply -auto-approve tfplan
  dependencies:
    - fetch_secrets
    - terraform_plan
  rules:
    - if: '$ENVIRONMENT == "dev"'
      when: on_success
    - if: '$ENVIRONMENT == "staging" || $ENVIRONMENT == "prod"'
      when: on_success
      needs:
        - approval
  environment:
    name: ${ENVIRONMENT}
  tags:
    - docker

# Cleanup stage
cleanup:
  stage: cleanup
  image: alpine:latest
  script:
    - echo "Cleaning up temporary files..."
    - rm -f secrets.env secrets.json || true
  when: always
  tags:
    - docker