---
# GitLab CI/CD Pipeline for Terraform ECS Infrastructure

stages:
  - setup
  - validate
  - quality
  - security
  - plan
  - approve
  - apply

variables:
  TF_VERSION: "1.0.0"
  AWS_REGION: "us-east-1"
  TF_STATE_KEY: "ecs-infrastructure/terraform.tfstate"
  TF_LOCK_TABLE: "terraform-state-lock"
  CONTAINER_IMAGE: "nginx:latest"

# Define reusable templates
.terraform_docker:
  image: hashicorp/terraform:${TF_VERSION}
  before_script:
    - terraform --version
    - aws --version

.aws_auth:
  before_script:
    - aws configure set aws_access_key_id ${AWS_ACCESS_KEY_ID}
    - aws configure set aws_secret_access_key ${AWS_SECRET_ACCESS_KEY}
    - aws configure set region ${AWS_REGION}

# Setup stage
setup:
  stage: setup
  image: alpine:latest
  script:
    - apk add --no-cache curl jq python3 py3-pip
    - pip install awscli
    - aws --version
    - echo "Setting up CloudWatch logging..."
    - aws logs create-log-group --log-group-name "/gitlab/pipeline" --region ${AWS_REGION} || true
    - aws logs create-log-stream --log-group-name "/gitlab/pipeline" --log-stream-name "${CI_PIPELINE_ID}" --region ${AWS_REGION} || true
  tags:
    - docker

# Fetch secrets from AWS Secrets Manager
fetch_secrets:
  stage: setup
  image: alpine:latest
  extends: .aws_auth
  script:
    - apk add --no-cache curl jq python3 py3-pip
    - pip install awscli
    - echo "Fetching secrets from AWS Secrets Manager..."
    - aws secretsmanager get-secret-value --secret-id "terraform/ecs-infrastructure" --region ${AWS_REGION} --query SecretString --output text > secrets.json
    - cat secrets.json | jq -r 'to_entries[] | "\(.key)=\(.value)"' > secrets.env
  artifacts:
    paths:
      - secrets.env
    expire_in: 1 hour
  tags:
    - docker

# Validate Terraform code
terraform_validate:
  stage: validate
  extends: .terraform_docker
  script:
    - terraform init -backend=false
    - terraform validate
  tags:
    - docker

# Check Terraform formatting
terraform_fmt:
  stage: validate
  extends: .terraform_docker
  script:
    - terraform fmt -check -recursive
  tags:
    - docker

# SonarQube analysis
sonarqube_analysis:
  stage: quality
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.projectKey=${CI_PROJECT_NAME} -Dsonar.sources=. -Dsonar.host.url=${SONAR_HOST_URL} -Dsonar.login=${SONAR_TOKEN}
  only:
    - merge_requests
    - main
  tags:
    - docker

# Snyk security scan
snyk_scan:
  stage: security
  image: snyk/snyk:latest
  script:
    - snyk auth ${SNYK_TOKEN}
    - snyk test --all-projects
  only:
    - merge_requests
    - main
  allow_failure: true
  tags:
    - docker

# Terraform plan for each environment
.terraform_plan:
  extends: .terraform_docker
  stage: plan
  script:
    - export $(cat secrets.env | xargs)
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
    - terraform plan -var="environment=${ENVIRONMENT}" -var="region=${AWS_REGION}" -var="container_image=${CONTAINER_IMAGE}" -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 day
  dependencies:
    - fetch_secrets
  tags:
    - docker

plan_dev:
  extends: .terraform_plan
  variables:
    ENVIRONMENT: "dev"
  only:
    - merge_requests
    - main

plan_staging:
  extends: .terraform_plan
  variables:
    ENVIRONMENT: "staging"
  only:
    - main

plan_prod:
  extends: .terraform_plan
  variables:
    ENVIRONMENT: "prod"
  only:
    - main

# Manual approval for staging and prod environments
approve_staging:
  stage: approve
  script:
    - echo "Deployment to staging environment has been approved"
  when: manual
  only:
    - main
  environment:
    name: staging
  needs:
    - plan_staging

approve_prod:
  stage: approve
  script:
    - echo "Deployment to production environment has been approved"
  when: manual
  only:
    - main
  environment:
    name: production
  needs:
    - plan_prod

# Terraform apply for each environment
.terraform_apply:
  extends: .terraform_docker
  stage: apply
  script:
    - export $(cat secrets.env | xargs)
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="dynamodb_table=${TF_LOCK_TABLE}"
    - terraform apply -auto-approve tfplan
  dependencies:
    - fetch_secrets
  tags:
    - docker

apply_dev:
  extends: .terraform_apply
  variables:
    ENVIRONMENT: "dev"
  only:
    - main
  needs:
    - plan_dev

apply_staging:
  extends: .terraform_apply
  variables:
    ENVIRONMENT: "staging"
  only:
    - main
  needs:
    - approve_staging
  environment:
    name: staging

apply_prod:
  extends: .terraform_apply
  variables:
    ENVIRONMENT: "prod"
  only:
    - main
  needs:
    - approve_prod
  environment:
    name: production