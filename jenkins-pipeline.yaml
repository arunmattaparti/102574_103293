---
# Jenkins Pipeline Configuration as Code (JCasC) template
# This YAML file defines a reusable Jenkins pipeline for deploying Terraform infrastructure to AWS

jenkins:
  systemMessage: "Jenkins configured automatically for Terraform ECS Infrastructure deployment"
  
  # Global security settings
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"
  
  # Authorization strategy
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Jenkins administrators"
            permissions:
              - "Overall/Administer"
            assignments:
              - "admin"
          - name: "developer"
            description: "Developers with deploy permissions"
            permissions:
              - "Overall/Read"
              - "Job/Build"
              - "Job/Read"
              - "Job/Workspace"
            assignments:
              - "developer"

  # Node configuration
  nodes:
    - permanent:
        name: "terraform-agent"
        remoteFS: "/home/jenkins"
        launcher:
          jnlp:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: "remoting"
        nodeProperties:
          - envVars:
              env:
                - key: "PATH"
                  value: "/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin"

# Plugins required for the pipeline
tool:
  terraform:
    installations:
      - name: "Terraform"
        home: "/usr/local/bin/terraform"
        properties:
          - installSource:
              installers:
                - terraformInstaller:
                    id: "1.0.0"

# Credentials configuration
credentials:
  system:
    domainCredentials:
      - credentials:
          - aws:
              scope: GLOBAL
              id: "aws-credentials"
              accessKey: "${AWS_ACCESS_KEY_ID}"
              secretKey: "${AWS_SECRET_ACCESS_KEY}"
              description: "AWS credentials for Terraform"
          - string:
              scope: GLOBAL
              id: "terraform-backend-key"
              secret: "${TERRAFORM_BACKEND_KEY}"
              description: "Encryption key for Terraform backend"

# Job definitions
jobs:
  - script: >
      pipelineJob('terraform-ecs-infrastructure') {
        description('Pipeline for deploying Terraform ECS infrastructure to AWS')
        
        parameters {
          choiceParam('ENVIRONMENT', ['dev', 'staging', 'prod'], 'Environment to deploy to')
          stringParam('AWS_REGION', 'us-east-1', 'AWS region to deploy to')
          stringParam('TF_STATE_BUCKET', '', 'S3 bucket for Terraform state')
          stringParam('TF_STATE_KEY', 'ecs-infrastructure/terraform.tfstate', 'S3 key for Terraform state')
          stringParam('TF_LOCK_TABLE', 'terraform-state-lock', 'DynamoDB table for state locking')
          stringParam('CONTAINER_IMAGE', 'nginx:latest', 'Container image to deploy')
        }
        
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('${GIT_REPO_URL}')
                  credentials('git-credentials')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
        
        triggers {
          scm('H/15 * * * *')
        }
        
        logRotator {
          numToKeep(10)
          daysToKeep(30)
        }
      }

# Pipeline libraries
unclassified:
  globalLibraries:
    libraries:
      - name: "terraform-pipeline-library"
        defaultVersion: "main"
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/example/terraform-pipeline-library.git"
                credentialsId: "git-credentials"